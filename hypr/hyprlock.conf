source = ~/.cache/wal/colors-hyprlock

general {
    hide_cursor = true
    immediate_render = true
}

# ===== BACKGROUND =====

background {
    monitor =
    path = screenshot

    blur_passes = 4
    blur_size = 7

    brightness = 0.55
    contrast = 1.05
    vibrancy = 0.20
    noise = 0.008
}

# ===== CLOCK =====

label {
    monitor =

    text = $TIME12
    color = $foreground

    font_size = 78
    font_family = JetBrainsMono Nerd Font

    position = 0, 150
    halign = center
    valign = center

    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.65)
}

# ===== DATE =====

label {
    monitor =

    text = cmd[update:60000] date '+%A, %d %B'
    color = $color7

    font_size = 18
    font_family = JetBrainsMono Nerd Font

    position = 0, 65
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.55)
}

# ===== PASSWORD =====

input-field {
    monitor =

    size = 420, 58
    outline_thickness = 2

    outer_color = $color4
    inner_color = rgba(0, 0, 0, 0.48)
    font_color = rgb(255, 255, 255)

    check_color = $color2
    fail_color = $color1

    font_family = JetBrainsMono Nerd Font

    placeholder_text = <span foreground="##c4d8d4">Password...</span>
    fail_text = <span foreground="##DBB440">$FAIL</span>

    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true

    fade_on_empty = false
    rounding = 18

    position = 0, -35
    halign = center
    valign = center

    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.55)
}

# ===== USER =====

label {
    monitor =

    text =   $USER
    color = $color4

    font_size = 15
    font_family = JetBrainsMono Nerd Font

    position = 0, -95
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)
}

source = ~/.config/hypr/hyprlock-pokemon.conf
